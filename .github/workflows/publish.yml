name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (otherwise only verify the build)
        type: boolean
        default: false
      release_tag:
        description: Existing version tag to build for a manual publication
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Require an exact tag for manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel install
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          saikai --version
          saikai --print-config

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saikai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
